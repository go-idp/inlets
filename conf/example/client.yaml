# Inlets Client Configuration Example
#
# Use with:
#   inlets client -c ./conf/example/client.yaml
#   inlets client --server https://tunnel.example.com http --sub-domain myapp 127.0.0.1:9000
#
# You can still override any field from CLI flags. Use subcommands: `http` and `tcp`.
#
# CLI overrides for http: `http -s ...`, `--username` / `--password` (env: UPSTREAM_HTTP_*, SUB_DOMAIN on `http`).
# Username/password apply to your local upstream; when the server tunnel does not configure edge auth, the same Basic is enforced on the public URL (401 until curl sends Authorization).

# Tunnel type: http | tcp
type: http

# Upstream target (port only or host:port)
upstream: 127.0.0.1:9000

# HTTP tunnel options (only for type: http)
http:
  subDomain: myapp

# For tcp: public port on the server (same as CLI: tcp -p). Older configs may use a single
# top-level `port` when type is tcp; do not set both.
# tcp:
#   port: 20100

# Authentication: one of --token, or --client-id + --client-secret (higher priority than
# the single-line credentials), or clientId:clientSecret in one field:
credentials: client1:secret1
# clientId: client1
# clientSecret: secret1
# token: your-secret-token

# Server endpoint (v2 mode, default)
server: http://127.0.0.1:8080

# Legacy mode endpoints (used only with legacy: true)
# remote: 127.0.0.1:8080
# remoteTCPPort: 8443
# legacy: false

# Runtime options
healthcheckInterval: 30000
# reportURL: https://example.com/report

# Inlets Client Configuration Example
#
# NOTE: Currently, the inlets client uses command-line arguments for configuration.
# This file serves as a reference for available options and their usage.
#
# Future versions may support YAML configuration files.
#
# Usage examples:
#
# HTTP Tunnel:
#   inlets client --server https://tunnel.example.com http --sub-domain myapp 127.0.0.1:9000
#   inlets client --server https://tunnel.example.com/base http --sub-domain myapp 127.0.0.1:9000
#
# TCP Tunnel with Token:
#   inlets client -r tunnel.example.com:443 -t your-token tcp -p 20100 127.0.0.1:22
#
# TCP Tunnel with Credentials:
#   inlets client -r tunnel.example.com:443 --credentials clientId:clientSecret tcp -p 20100 127.0.0.1:22
#
# Public HTTP Tunnel (no authentication):
#   inlets client -r tunnel.example.com:443 http 127.0.0.1:9000

# Configuration Reference:
#
# Required Arguments:
#   [type]        - Tunnel type: "http" or "tcp"
#   [upstream]     - Upstream address: port (e.g., 9000) or hostname:port (e.g., 127.0.0.1:9000)
#
# Optional Flags:
#   --server                  v2 server URL (http/https, optional path) (env: SERVER)
#                            Example: https://tunnel.example.com/base
#
#   -r, --remote              Legacy server address (default: inlets.zcorky.com:443)
#                            Example: tunnel.example.com:443 (legacy mode)
#
#   (on `tcp` subcommand) -p, --port — public port on server (env: TUNNEL_PORT)
#                            Example: 20100
#
#   -t, --token               Authentication token (env: TOKEN)
#                            Example: your-secret-token
#
#   --credentials             Authentication credentials in format clientId:clientSecret (env: CREDENTIALS)
#                            Example: client1:secret1
#
#   --remote-tcp-port         Legacy server TCP port (default: 8443, env: REMOTE_TCP_PORT)
#                            Example: 8443 (legacy mode)
#
#   --healthcheck-interval    Service health check interval in milliseconds (default: 30000, env: HEALTHCHECK_INTERVAL)
#                            Example: 30000
#
#   --report-url              Error report URL (env: REPORT_URL)
#                            Example: https://api.example.com/report
#
#   --legacy                  Use legacy protocol version (v1); required when using --remote / --remote-tcp-port (env: LEGACY)
#                            Example: false
#
# Authentication Types:
#   1. Token: Use -t or --token flag
#      Example: inlets client -t your-token http 127.0.0.1:9000
#
#   2. Credentials: Use --credentials flag (format: clientId:clientSecret)
#      Example: inlets client --credentials client1:secret1 tcp 127.0.0.1:22
#
#   3. Public: No authentication (only for HTTP tunnels)
#      Example: inlets client http 127.0.0.1:9000
#
# Examples:
#
# Development - Local HTTP tunnel:
#   inlets client -r 127.0.0.1:8080 http 127.0.0.1:9000
#
# Production - HTTP tunnel with subdomain:
#   inlets client -r tunnel.example.com:443 -t your-token http --sub-domain myapp 127.0.0.1:9000
#
# SSH tunnel via TCP:
#   inlets client -r tunnel.example.com:443 --credentials client1:secret1 tcp -p 20100 127.0.0.1:22
#
# Database tunnel via TCP:
#   inlets client -r tunnel.example.com:443 -t your-token tcp -p 3306 127.0.0.1:3306
